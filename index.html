<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Imagens</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .imagem {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .imagem {
                margin-bottom: 15px;
                border-radius: 8px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img src="1.png" alt="Imagem 1" class="imagem">

        <img src="2.png" alt="Imagem 2" class="imagem">

    </main>

</body>
</html>
